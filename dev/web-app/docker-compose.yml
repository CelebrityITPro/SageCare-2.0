version: '3.8'

services:
  # SageCare API (Backend)
  sagecare-api:
    build:
      context: ./sage-care-api
      dockerfile: Dockerfile
    container_name: sagecare-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_CONNECTION_URL=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - PORT=5000
    networks:
      - sagecare-network
    volumes:
      - ./sage-care-api:/usr/src/app
      - /usr/src/app/node_modules

  # SageCare Frontend (React)
  sagecare-frontend:
    build:
      context: ./sage-care-frontend
      dockerfile: Dockerfile
    container_name: sagecare-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
      - VITE_FOOD_API_URL=${VITE_FOOD_API_URL:-http://localhost:5001}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - sagecare-api
    networks:
      - sagecare-network
    volumes:
      - ./sage-care-frontend:/usr/src/app
      - /usr/src/app/node_modules

  # Food Inference API (Python/ML)
  food-inference-api:
    build:
      context: ./food-inference-api
      dockerfile: Dockerfile
    container_name: food-inference-api
    restart: unless-stopped
    ports:
      - "5001:5001"  # Map host 5001 to container 5001
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=${FLASK_ENV:-production}
      - PYTHONPATH=/app
      - PORT=5001
      - MONGODB_URI=${MONGODB_URI}
    networks:
      - sagecare-network
    volumes:
      - ./food-inference-api:/app
      - food_models:/app/models
      - food_uploads:/app/uploads

networks:
  sagecare-network:
    driver: bridge

volumes:
  food_models:
  food_uploads: